---
- name: Install and Configure HashiCorp Vault
  hosts: vault_servers
  become: yes
  vars:
    vault_version: "1.15.2"
    vault_user: "vault"
    vault_group: "vault"
    vault_home: "/opt/vault"
    vault_config_dir: "/etc/vault.d"
    vault_data_dir: "/opt/vault/data"
    vault_log_dir: "/var/log/vault"

  tasks:
    - name: Update system packages
      apt:
        update_cache: yes
        upgrade: yes
      when: ansible_os_family == "Debian"

    - name: Install required packages
      apt:
        name:
          - unzip
          - curl
          - jq
        state: present
      when: ansible_os_family == "Debian"

    - name: Create vault group
      group:
        name: "{{ vault_group }}"
        state: present

    - name: Create vault user
      user:
        name: "{{ vault_user }}"
        group: "{{ vault_group }}"
        system: yes
        shell: /bin/false
        home: "{{ vault_home }}"
        createhome: no
        state: present

    - name: Create vault directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ vault_user }}"
        group: "{{ vault_group }}"
        mode: '0755'
      loop:
        - "{{ vault_home }}"
        - "{{ vault_config_dir }}"
        - "{{ vault_data_dir }}"
        - "{{ vault_log_dir }}"

    - name: Download Vault binary
      get_url:
        url: "https://releases.hashicorp.com/vault/{{ vault_version }}/vault_{{ vault_version }}_linux_amd64.zip"
        dest: "/tmp/vault_{{ vault_version }}_linux_amd64.zip"
        mode: '0644'

    - name: Unzip Vault binary
      unarchive:
        src: "/tmp/vault_{{ vault_version }}_linux_amd64.zip"
        dest: "/tmp"
        remote_src: yes

    - name: Move Vault binary to system path
      copy:
        src: "/tmp/vault"
        dest: "/usr/local/bin/vault"
        owner: root
        group: root
        mode: '0755'
        remote_src: yes

    - name: Set Vault binary capabilities
      command: setcap cap_ipc_lock=+ep /usr/local/bin/vault

    - name: Create Vault configuration file
      template:
        src: vault.hcl.j2
        dest: "{{ vault_config_dir }}/vault.hcl"
        owner: "{{ vault_user }}"
        group: "{{ vault_group }}"
        mode: '0640'
      notify:
        - restart vault

    - name: Create Vault systemd service file
      template:
        src: vault.service.j2
        dest: /etc/systemd/system/vault.service
        owner: root
        group: root
        mode: '0644'
      notify:
        - reload systemd
        - restart vault

    - name: Clean up downloaded files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/vault_{{ vault_version }}_linux_amd64.zip"
        - "/tmp/vault"

    - name: Enable and start Vault service
      systemd:
        name: vault
        enabled: yes
        state: started
        daemon_reload: yes

    - name: Wait for Vault to be ready
      wait_for:
        port: 8200
        host: 0.0.0.0
        delay: 10
        timeout: 60

    - name: Display Vault status
      uri:
        url: "http://localhost:8200/v1/sys/health"
        method: GET
        status_code: [200, 429, 472, 473, 501, 503]
      register: vault_health
      
    - name: Show Vault health status
      debug:
        msg: "Vault is installed and running. Health check response: {{ vault_health.json if vault_health.json is defined else 'No JSON response' }}"

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: yes

    - name: restart vault
      systemd:
        name: vault
        state: restarted